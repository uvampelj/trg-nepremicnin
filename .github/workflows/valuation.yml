name: Osveži vrednosti GURS

on:
  schedule:
    - cron: "40 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  valuation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Prenesi občinske izvoze in zgradi tabelo vrednosti
        id: build
        run: python -m pipeline.valuation

      - name: Objavi tabelo kot izdajo
        if: steps.build.outputs.built == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view valuation > /dev/null 2>&1; then
            gh release create valuation --title "Tabela vrednosti GURS" \
              --notes "Vmesni podatki za gradnjo strani. Vir: Geodetska uprava RS, Evidenca vrednotenja, CC BY 4.0."
          fi
          gh release upload valuation data/valuation/* --clobber
